name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish to GHCR
        required: false
        default: latest
      frontend_api_base_url:
        description: Public API base URL baked into the frontend image
        required: false
        default: https://awards-api.incelgroup.com/api/v1
      deploy:
        description: Also deploy to CapRover after push
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}
  LATEST_TAG: ${{ inputs.image_tag || 'latest' }}
  GHCR_OWNER: ${{ github.repository_owner }}
  FRONTEND_API_BASE_URL: ${{ inputs.frontend_api_base_url || 'https://awards-api.incelgroup.com/api/v1' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: incel_awards_db
          POSTGRES_USER: incel_awards_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incel_awards_user -d incel_awards_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-minimum-50-characters-long-for-testing-12345
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: incel_awards_db
      DB_USER: incel_awards_user
      DB_PASSWORD: ci_test_password
      USE_SQLITE: "false"
      EMAIL_ENABLED: "False"
      CELERY_TASK_ALWAYS_EAGER: "True"
      DEV_ORG_USERS_ENABLED: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install API dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        working-directory: api
        run: python manage.py check

      - name: Run Django test suite
        working-directory: api
        run: python manage.py test

  frontend-tests:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.FRONTEND_API_BASE_URL }}
        run: npm run build

  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-backend:${{ env.LATEST_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.FRONTEND_API_BASE_URL }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-frontend:${{ env.LATEST_TAG }}

  deploy-to-caprover:
    name: Deploy to CapRover
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy == 'true')
    steps:
      - name: Deploy API
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: incel-awards-api
          token: ${{ secrets.CAPROVER_TOKEN_API }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-backend:${{ env.LATEST_TAG }}

      - name: Deploy Celery worker
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: incel-awards-celery-worker
          token: ${{ secrets.CAPROVER_TOKEN_CELERY_WORKER }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-backend:${{ env.LATEST_TAG }}

      - name: Deploy Celery beat
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: incel-awards-celery-beat
          token: ${{ secrets.CAPROVER_TOKEN_CELERY_BEAT }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-backend:${{ env.LATEST_TAG }}

      - name: Deploy frontend
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: incel-awards-frontend
          token: ${{ secrets.CAPROVER_TOKEN_FRONTEND }}
          image: ghcr.io/${{ env.GHCR_OWNER }}/incel-awards-frontend:${{ env.LATEST_TAG }}
